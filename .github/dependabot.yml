# OpenRedius · 依赖自动更新(见 docs/14-ci-cd.md)
# 三个生态都是 GitHub 官方原生支持:github-actions 一直都有;uv 2025-03 GA;
# bun 已在支持矩阵里,但 dependabot-core 上有 bun.lock 更新相关的开放问题
# (https://github.com/dependabot/dependabot-core/issues/11602)——它开的 PR 如果
# lockfile 没跟着变,需要人工核实再合并,不要无脑 auto-merge。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
