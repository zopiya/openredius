# OpenRedius · 可复用镜像构建 workflow(不单独触发,见 docs/14-ci-cd.md)
# 被 images-build.yml(push main)、images-pr-check.yml(PR 校验)、release.yml(打 tag 发布)
# 三处 `uses:` 复用,避免三条流水线各写一份构建矩阵、彼此漂移。
name: Build images (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: "主 tag,如 latest / v0.2.0 / pr-123"
        required: true
        type: string
      extra_tag:
        description: "额外追加的 tag(可选),如 git sha"
        required: false
        type: string
        default: ""
      push:
        description: "是否推送到 GHCR;false 时只在 runner 本地 build+load,用于 PR 校验"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: deploy/nginx/Dockerfile
          - name: freeradius
            context: deploy/freeradius
            dockerfile: deploy/freeradius/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/openredius-${{ matrix.name }}"
          tags="$image:${{ inputs.tag }}"
          if [ -n "${{ inputs.extra_tag }}" ]; then
            tags="$tags
          $image:${{ inputs.extra_tag }}"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "local_tag=$image:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      # load: true 无论是否 push 都把镜像加载进本地 daemon,供下面 Trivy 直接扫描,
      # 不用为了扫描再多拉一次(push 时避免重复下载)。
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.push }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # 非阻断:先建立可见性(SARIF 上报到 Security 标签页),是否转硬阻断留到看过几轮真实
      # 扫描结果之后再定(见 docs/14-ci-cd.md)。
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local_tag }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
