# OpenRedius — build & push production images to GHCR (docs/07).
# Builds the 3 custom images (postgres stays upstream); server side then just
# `docker compose pull && up -d`, no build toolchain needed on the host.
name: Build images

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - deploy/freeradius/**
      - deploy/nginx/**
      - src/**
      - package.json
      - bun.lock
      - index.html
      - vite.config.ts
      - tsconfig*.json
      - .github/workflows/build-images.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: deploy/nginx/Dockerfile
          - name: freeradius
            context: deploy/freeradius
            dockerfile: deploy/freeradius/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/openredius-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/openredius-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
