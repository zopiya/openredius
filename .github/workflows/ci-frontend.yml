# OpenRedius CI · frontend(M0 落地,见 docs/09-testing-quality.md「CI」/ docs/14-ci-cd.md)
# 拆自原 ci.yml:只在前端相关路径变化时跑,避免纯后端改动空跑这个 job。
name: CI (frontend)

on:
  push:
    branches: [main, dev]
    paths:
      - src/**
      - tests/**
      - scripts/**
      - package.json
      - bun.lock
      - bunfig.toml
      - index.html
      - vite.config.ts
      - tsconfig*.json
      - .github/workflows/ci-frontend.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - scripts/**
      - package.json
      - bun.lock
      - bunfig.toml
      - index.html
      - vite.config.ts
      - tsconfig*.json
      - .github/workflows/ci-frontend.yml

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tsc 类型检查 + 14 路由冒烟 + 20 交互测试 + 原型保真度审计
      - name: Verify
        run: bun run verify
