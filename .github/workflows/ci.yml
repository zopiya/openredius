# OpenRedius CI(M0 落地,见 docs/09-testing-quality.md「CI」)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tsc 类型检查 + 13 路由冒烟 + 21 交互测试 + 原型保真度审计
      - name: Verify
        run: bun run verify

  # backend job:占位,M1(后端骨架与基础设施)起启用。
  # 届时步骤:astral-sh/setup-uv → uv sync → ruff check/format → uv run pytest -q
  # (见 docs/09-testing-quality.md「命令清单 · 后端」与 docs/10-roadmap.md M1)。
  backend:
