# OpenRedius CI(M0 落地,见 docs/09-testing-quality.md「CI」)
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tsc 类型检查 + 14 路由冒烟 + 20 交互测试 + 原型保真度审计
      - name: Verify
        run: bun run verify

  # backend job:M1(后端骨架与基础设施)起启用(已生效)。
  # 见 docs/09-testing-quality.md「命令清单 · 后端」与 docs/10-roadmap.md M1。
  backend:
    name: Backend (uv + ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
