# OpenRedius · PR 依赖引入审计(见 docs/14-ci-cd.md)
# 只审查这个 PR 新引入/升级的依赖,不扫描已存在于仓库的依赖(那部分交给 Dependabot + CodeQL)。
name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
