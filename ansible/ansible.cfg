# OpenRedius Ansible 控制器配置
# 用法:在 ansible/ 目录下执行 ansible-playbook,或 ANSIBLE_CONFIG 指向本文件。

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# 目标机可能是全新机器,首次连接无法校验 host key;显式关闭以避免交互卡住。
# 生产建议首连后改回 True 并固化 known_hosts。
host_key_checking = False
# 零信任:任何任务失败立即中止后续 host(单机部署,顺序敏感)。
any_errors_fatal = True
# 让 --check 干跑有意义:preflight 全量断言在 check 模式可跑。
stdout_callback = default
# 敏感变量(vault)默认不回显。
display_skipped_hosts = False
retry_files_enabled = False
# 统一中文环境下的可读输出与稳定排序。
interpreter_python = auto_silent
gathering = smart
fact_caching = memory
# 安全:禁用隐式 facts 注入风险点(保持默认即可,这里显式留白)

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-%%h-%%p-%%r

[diff]
always = True
