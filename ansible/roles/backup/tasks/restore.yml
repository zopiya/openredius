---
# backup role · restore —— 从备份恢复(P4)
# 需 openredius_restore_dump(控制器侧备份文件路径),经 restore.yml playbook 传入。

- name: 校验 dump 文件在控制器存在
  ansible.builtin.stat:
    path: "{{ openredius_restore_dump }}"
  delegate_to: localhost
  register: _dump_stat

- name: 断言 dump 文件存在
  ansible.builtin.assert:
    that: _dump_stat.stat.exists
    fail_msg: "控制器上不存在备份文件:{{ openredius_restore_dump }}"

- name: 拷贝备份到目标机 backups/
  ansible.builtin.copy:
    src: "{{ openredius_restore_dump }}"
    dest: "{{ openredius_deploy_root }}/backups/"
    mode: "0600"

- name: 渲染恢复脚本
  ansible.builtin.template:
    src: restore.sh.j2
    dest: "{{ openredius_deploy_root }}/restore.sh"
    mode: "0700"

- name: 执行恢复(停栈 → pg_restore → 重启)
  ansible.builtin.command:
    cmd: "{{ openredius_deploy_root }}/restore.sh {{ openredius_deploy_root }}/backups/{{ openredius_restore_dump | basename }}"
  environment:
    FORCE: "1"
  register: _restore
  changed_when: true
