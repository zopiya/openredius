# OpenRedius 目标机清单
# 生产环境请按需覆盖 ansible_host / ansible_user / ansible_port。
# 密钥类变量一律放 group_vars/all/vault.yml(加密),不要写在 hosts 里。

all:
  children:
    openredius:
      hosts:
        prod01:
          ansible_host: 192.0.2.10        # TODO: 替换为真实生产机 IP
          ansible_user: deploy             # TODO: 替换为部署用户(需 sudo 免密)
          ansible_port: 22
