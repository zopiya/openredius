---
# 升级:换镜像 tag → DB 迁移 → 滚动重启 → 健康断言
# 用法:
#   ansible-playbook playbooks/upgrade.yml --extra-vars "openredius_images.backend=ghcr.io/openredius/backend:0.2.0"
- name: OpenRedius 升级
  hosts: openredius
  gather_facts: true
  roles:
    - role: deploy
      tags: [deploy]
    - role: post_deploy
      tags: [verify]
