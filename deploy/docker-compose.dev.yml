# OpenRedius dev stack — Codespaces 栈集成用(docker-in-docker,ADR-0007)。
# M1:仅 postgres;freeradius 服务由 M3 增加。本地纯 SQLite 开发不依赖本文件。
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml ps   # 全部 healthy
#
# 口令来自 deploy/.env(或环境),缺省为 dev 默认值(见仓库根 .env.example)。

name: openredius-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openredius
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres-password}
      # 透传给 init 脚本(创建 openredius / radius 两个应用角色)
      OPENRADIUS_DB_PASSWORD: ${OPENRADIUS_DB_PASSWORD:-dev-only-openredius-password}
      RADIUS_SQL_PASSWORD: ${RADIUS_SQL_PASSWORD:-dev-only-radius-sql-password}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openredius"]
      interval: 5s
      timeout: 3s
      retries: 12

  freeradius:
    build: ./freeradius
    image: openredius/freeradius
    environment:
      RADIUS_SQL_HOST: postgres
      RADIUS_SQL_PORT: "5432"
      RADIUS_SQL_USER: radius
      RADIUS_SQL_PASSWORD: ${RADIUS_SQL_PASSWORD:-dev-only-radius-sql-password}
      RADIUS_SQL_DB: openredius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      # dev 证书(gen.sh 生成;缺失时镜像内 eap 使用上游自带证书,仅 PEAP 冒烟)
      - ./freeradius/certs:/etc/raddb/certs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 配置语法校验(radiusd -CX);不探测 1812 端口,避免依赖客户端
      test: ["CMD", "radiusd", "-CX"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
