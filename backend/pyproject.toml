[project]
name = "openredius"
version = "0.2.2"
description = "OpenRedius backend — RADIUS network access management console"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52.1,<0.53",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30",
    "aiosqlite>=0.21",
    "alembic>=1.19,<1.20",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "pyrad==2.5.4",
    "ldap3==2.9.1",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "httpx>=0.28,<0.29",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "asgi-lifespan>=2.1",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openredius"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idioms.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.security.HTTPBearer",
    "openredius.core.deps.require_role",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Unit/API suites run everywhere; stack integration needs the compose stack
# (docs/09): `uv run pytest -m integration` overrides this filter.
addopts = "-m 'not integration'"
markers = [
    "integration: stack integration tests (require docker compose dev stack)",
]
